services:
  ember:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=emberdb;Username=${DB_USER};Password=${DB_PASSWORD};GSS Encryption Mode=Disable
      BotToken: ${BOT_TOKEN}
      DevGuildId: ${DEV_GUILD_ID:-}
      Ember__PrivacyPolicyUrl: ${PRIVACY_POLICY_URL:-}
      Ember__WebOrigin: ${WEB_ORIGIN:-}
      WebPush__PublicKey: ${VAPID_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${VAPID_PRIVATE_KEY:-}
      WebPush__Subject: ${VAPID_SUBJECT:-}
    networks:
      - homeserver-net

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        VITE_PUBLIC_ORIGIN: ${VITE_PUBLIC_ORIGIN:-}
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=emberdb;Username=${DB_USER};Password=${DB_PASSWORD};GSS Encryption Mode=Disable
      Ember__WebOrigin: ${WEB_ORIGIN}
      Ember__DataProtectionKeysPath: /keys
      Ember__WebRoot: /app/wwwroot
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      Ember__ForwardedHeaders__KnownProxies__0: ${API_KNOWN_PROXY:-}
      Ember__ForwardedHeaders__KnownNetworks__0: ${API_KNOWN_NETWORK:-}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}
      Smtp__ReplyTo: ${SMTP_REPLY_TO:-}
      Discord__ClientId: ${DISCORD_CLIENT_ID}
      Discord__ClientSecret: ${DISCORD_CLIENT_SECRET}
      WebPush__PublicKey: ${VAPID_PUBLIC_KEY:-}
    healthcheck:
      test: ["CMD", "dotnet", "/app/Ember.Api.dll", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ember-api-keys:/keys
    ports:
      - "127.0.0.1:5080:8080"
    networks:
      - homeserver-net

volumes:
  ember-api-keys:

networks:
  homeserver-net:
    external: true
