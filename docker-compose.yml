services:
  ember:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=emberdb;Username=${DB_USER};Password=${DB_PASSWORD}
      BotToken: ${BOT_TOKEN}
      DevGuildId: ${DEV_GUILD_ID:-}
      Ember__PrivacyPolicyUrl: ${PRIVACY_POLICY_URL:-}
      Ember__WebOrigin: ${WEB_ORIGIN:-}
    networks:
      - homeserver-net

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=emberdb;Username=${DB_USER};Password=${DB_PASSWORD}
      Ember__WebOrigin: ${WEB_ORIGIN}
      Ember__DataProtectionKeysPath: /keys
      Ember__ForwardedHeaders__KnownProxies__0: ${API_KNOWN_PROXY}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}
      Discord__ClientId: ${DISCORD_CLIENT_ID}
      Discord__ClientSecret: ${DISCORD_CLIENT_SECRET}
    volumes:
      - ember-api-keys:/keys
    ports:
      - "127.0.0.1:5080:8080"
    networks:
      - homeserver-net

volumes:
  ember-api-keys:

networks:
  homeserver-net:
    external: true
