apply plugin: 'com.android.application'

def signingPasswordFile = project.findProperty('emberUploadStorePasswordFile')
def signingFilePassword = signingPasswordFile ? file(signingPasswordFile).text.trim() : null
def signing = [
    emberUploadStoreFile: project.findProperty('emberUploadStoreFile'),
    emberUploadStorePassword: project.findProperty('emberUploadStorePassword') ?: signingFilePassword,
    emberUploadKeyAlias: project.findProperty('emberUploadKeyAlias'),
    emberUploadKeyPassword: project.findProperty('emberUploadKeyPassword') ?: signingFilePassword,
]
def missingSigning = signing.findAll { !it.value }.keySet()

android {
    namespace = "app.ember.habits"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.ember.habits"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((project.findProperty('emberVersionCode') ?: '7') as int)
        versionName(project.findProperty('emberVersionName') ?: '0.9.0-beta.5')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (missingSigning.isEmpty()) {
            release {
                storeFile file(signing.emberUploadStoreFile)
                storePassword signing.emberUploadStorePassword
                keyAlias signing.emberUploadKeyAlias
                keyPassword signing.emberUploadKeyPassword
            }
        }
    }
    flavorDimensions = ['channel']
    productFlavors {
        beta {
            dimension 'channel'
        }
        play {
            dimension 'channel'
        }
    }
    buildTypes {
        release {
            if (missingSigning.isEmpty()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    bundle {
        language {
            enableSplit = false
        }
    }
}

def releaseRequested = gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['assembleRelease', 'bundleRelease', 'assembleBetaRelease', 'bundleBetaRelease', 'bundlePlayRelease'] }
if (releaseRequested && !missingSigning.isEmpty()) {
    throw new GradleException("Release signing is not set up. Missing Gradle properties: ${missingSigning.join(', ')}. " +
        "Set them in ~/.gradle/gradle.properties or as ORG_GRADLE_PROJECT_<name> environment variables (see mobile/STORE.md).")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
